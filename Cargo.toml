[workspace]
members = [".", "hook"]

[package]
name = "wp-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wp-engine"
path = "src/main.rs"

[dependencies]
# Wayland renderer
smithay-client-toolkit = "0.18"
wayland-client          = "0.31"
wayland-protocols-wlr   = "0.2"
calloop                 = "0.12"
calloop-wayland-source  = "0.2"

# GUI
eframe = { version = "0.33", features = ["wayland"] }
egui   = "0.33"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Image loading (thumbnails only)
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
anyhow = "1"
dirs   = "5"
